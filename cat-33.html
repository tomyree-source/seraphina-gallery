<script>
(function(){
var KEY='seraGalleryMarksV1';
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}
function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
var data=load();
var page=(location.pathname.split('/').pop()||'index.html');
var catEl=document.querySelector('header h2')||document.querySelector('header h1');
var catName=catEl?catEl.textContent.trim():page;
var filter='all';
var figs=[], seen={};
document.querySelectorAll('figure').forEach(function(fg){
  var img=fg.querySelector('img'); if(!img)return;
  var title=img.dataset.title||((fg.querySelector('figcaption')||{}).textContent||'').trim();
  var occ=seen[title]||0; seen[title]=occ+1;
  var key=page+'|'+title+'|'+occ;
  var rec=data[key]||{f:0,x:0,m:'',c:catName,t:title};
  data[key]=rec;
  var row=document.createElement('div'); row.className='mkrow';
  var bF=document.createElement('button'); bF.className='mkbtn'; bF.textContent='★お気に入り';
  var bX=document.createElement('button'); bX.className='mkbtn'; bX.textContent='✎直したい';
  var memo=document.createElement('input'); memo.className='mkmemo'; memo.type='text'; memo.placeholder='メモ（直したい所・好きな点など）'; memo.value=rec.m||'';
  bF.addEventListener('click',function(){rec.f=rec.f?0:1;save(data);paint();});
  bX.addEventListener('click',function(){rec.x=rec.x?0:1;save(data);paint();});
  memo.addEventListener('change',function(){rec.m=memo.value;save(data);});
  row.appendChild(bF); row.appendChild(bX); row.appendChild(memo);
  fg.appendChild(row);
  figs.push({fg:fg,rec:rec,bF:bF,bX:bX,memo:memo,key:key});
});
var bar=document.getElementById('mkbar');
bar.innerHTML='<span class="cnt" id="mkcnt"></span>'
 +'<button data-fl="all">すべて</button><button data-fl="fav">★のみ</button><button data-fl="fix">✎のみ</button>'
 +'<button class="send" id="mksend">Museに送る</button>'
 +'<span style="color:#888">★=生成の参考にします／✎=修正依頼</span>';
bar.querySelectorAll('[data-fl]').forEach(function(b){
  b.addEventListener('click',function(){filter=b.dataset.fl;paint();});
});
function paint(){
  var pf=0,px=0,tf=0,tx=0;
  Object.keys(data).forEach(function(k){if(data[k].f)tf++;if(data[k].x)tx++;});
  figs.forEach(function(o){
    if(o.rec.f)pf++; if(o.rec.x)px++;
    o.fg.classList.toggle('mk-fav',!!o.rec.f);
    o.fg.classList.toggle('mk-fix',!!o.rec.x);
    o.bF.classList.toggle('on-fav',!!o.rec.f);
    o.bX.classList.toggle('on-fix',!!o.rec.x);
    if(document.activeElement!==o.memo && o.memo.value!==(o.rec.m||'')) o.memo.value=o.rec.m||'';
    o.memo.style.display=(o.rec.f||o.rec.x)?'block':'none';
    var showIt = filter==='all' || (filter==='fav'&&o.rec.f) || (filter==='fix'&&o.rec.x);
    o.fg.style.display=showIt?'':'none';
  });
  bar.querySelectorAll('[data-fl]').forEach(function(b){b.classList.toggle('on',b.dataset.fl===filter);});
  document.getElementById('mkcnt').textContent='このページ ★'+pf+'／✎'+px+'（全体 ★'+tf+'／✎'+tx+'）';
  paintViewer();
}
function summaryText(){
  var favs=[],fixs=[];
  Object.keys(data).forEach(function(k){var r=data[k];if(r.f)favs.push(r);if(r.x)fixs.push(r);});
  function line(r){return '・['+r.c+'] '+r.t+(r.m?'（メモ：'+r.m+'）':'');}
  var s='【セラフィナギャラリー】マーク送信\n';
  s+='■お気に入り（生成の参考）'+favs.length+'件\n'+(favs.length?favs.map(line).join('\n'):'（なし)')+'\n';
  s+='■直したい（修正依頼）'+fixs.length+'件\n'+(fixs.length?fixs.map(line).join('\n'):'（なし)');
  return s;
}
var modal=document.getElementById('mkmodal');
document.getElementById('mksend').addEventListener('click',function(){
  document.getElementById('mktext').value=summaryText();
  document.getElementById('mkcopied').textContent='';
  modal.style.display='flex';
});
document.getElementById('mkclose').addEventListener('click',function(){modal.style.display='none';});
modal.addEventListener('click',function(e){if(e.target===modal)modal.style.display='none';});
document.getElementById('mkcopy').addEventListener('click',function(){
  var ta=document.getElementById('mktext'); ta.removeAttribute('readonly'); ta.select();
  function done(){document.getElementById('mkcopied').textContent='コピーしました。チャットに貼ってください。';ta.setAttribute('readonly','');}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done).catch(function(){try{document.execCommand('copy');}catch(e){}done();});}
  else{try{document.execCommand('copy');}catch(e){}done();}
});
/* viewer integration */
var viewer=document.getElementById('viewer');
var curKey=null;
if(viewer){
  var vm=document.createElement('div'); vm.id='vmarks';
  var vbF=document.createElement('button'); vbF.className='mkbtn'; vbF.textContent='★お気に入り';
  var vbX=document.createElement('button'); vbX.className='mkbtn'; vbX.textContent='✎直したい';
  var vmemo=document.createElement('input'); vmemo.className='mkmemo'; vmemo.type='text'; vmemo.placeholder='メモ（直したい所・好きな点など）';
  vm.appendChild(vbF); vm.appendChild(vbX); vm.appendChild(vmemo);
  vm.addEventListener('click',function(e){e.stopPropagation();});
  viewer.appendChild(vm);
  function curRec(){return curKey?data[curKey]:null;}
  vbF.addEventListener('click',function(){var r=curRec();if(!r)return;r.f=r.f?0:1;save(data);paint();});
  vbX.addEventListener('click',function(){var r=curRec();if(!r)return;r.x=r.x?0:1;save(data);paint();});
  vmemo.addEventListener('change',function(){var r=curRec();if(!r)return;r.m=vmemo.value;save(data);paint();});
  window.__vmEls={vbF:vbF,vbX:vbX,vmemo:vmemo};
  var origShow=window.show;
  if(typeof origShow==='function'){
    window.show=function(el){
      origShow(el);
      curKey=null;
      figs.forEach(function(o){if(o.fg.contains(el))curKey=o.key;});
      paintViewer();
    };
  }
}
function paintViewer(){
  if(!window.__vmEls)return;
  var r=curKey?data[curKey]:null;
  var e=window.__vmEls;
  e.vbF.classList.toggle('on-fav',!!(r&&r.f));
  e.vbX.classList.toggle('on-fix',!!(r&&r.x));
  if(r&&document.activeElement!==e.vmemo)e.vmemo.value=r.m||'';
  e.vmemo.style.display=(r&&(r.f||r.x))?'block':'none';
}
paint();
})();
</script>
